{% extends "base.html" %}{% block content %}
<div class="wide-card"><h2>Loan Application Details</h2><p class="muted">Enter all details. The approval result is generated by the trained ML model.</p>
<form method="post" class="form-grid">
<div><label>Applicant Name</label><input name="applicant_name" required></div>
<div><label>Gender</label><select name="gender" required><option>Male</option><option>Female</option></select></div>
<div><label>Age</label><input type="number" name="age" min="18" max="100" required></div>
<div><label>Monthly Income (₹)</label><input type="number" name="monthly_income" min="1" step="any" required></div>
<div><label>Loan Amount (₹)</label><input type="number" name="loan_amount" min="1" step="any" required></div>
<div><label>Credit Score (300–900)</label><input type="number" name="credit_score" min="300" max="900" required></div>
<div><label>Employment Status</label><select name="employment_status"><option>Employed</option><option>Self-Employed</option><option>Unemployed</option></select></div>
<div><label>Existing Loans</label><input type="number" name="existing_loans" min="0" required></div>
<div><label>Loan Term (months)</label><select name="loan_term"><option>12</option><option>24</option><option>36</option><option>48</option><option>60</option></select></div>
<div><label>Property Area</label><select name="property_area"><option>Urban</option><option>Semi-Urban</option><option>Rural</option></select></div>
<div class="span-two"><button class="btn full">Predict Loan Approval</button></div>
</form></div>
{% endblock %}
