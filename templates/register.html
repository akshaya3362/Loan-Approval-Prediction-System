{% extends "base.html" %}{% block content %}
<div class="form-card"><h2>Create account</h2><p class="muted">Register to use the prediction system.</p>
<form method="post"><label>Full name</label><input name="name" required>
<label>Email</label><input type="email" name="email" required>
<label>Password (minimum 6 characters)</label><input type="password" name="password" minlength="6" required>
<button class="btn full">Register</button></form><p class="muted">Already registered? <a href="{{ url_for('login') }}">Login</a></p></div>
{% endblock %}
